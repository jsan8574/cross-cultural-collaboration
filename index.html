<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cross-Cultural Collaboration</title>
<meta name="description" content="A self-paced, two-track programme on cross-cultural collaboration between US, Philippines, India and Sri Lanka teams.">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230B2434'/><text x='50' y='70' font-size='58' font-family='Helvetica,Arial' font-weight='bold' fill='%232E9CAB' text-anchor='middle'>C</text></svg>">
<!-- Cache-busting: bump ?v=N on EVERY css/js edit. See README. -->
<link rel="stylesheet" href="css/styles.css?v=15">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brandmark" href="#/" aria-label="Course home">
      <span class="bm-txt">
        <b>Cross-Cultural</b>
        <i>Collaboration</i>
      </span>
    </a>

    <span class="tdiv" id="tdiv1" hidden></span>
    <div class="tcourse" id="tcourse" hidden>
      <span class="edition" id="tedition"></span>
      <b id="ttitle"></b>
    </div>

    <div class="topbar-sp"></div>

    <div class="tmeta" id="tgreet" hidden><b id="tname"></b></div>
    <span class="tdiv" id="tdiv2" hidden></span>
    <div class="tmeta stack" id="ttime" hidden>
      <span class="edition">Active time</span>
      <b id="tclock">0m 0s</b>
    </div>
    <button class="savebtn" id="savebtn" hidden>Save Now</button>
    <button class="savebtn ghost" id="backhome" hidden>Change Context</button>
  </div>
  <div class="progressbar"><i id="pbar"></i></div>
</header>

<main>
  <section id="home" class="screen on"></section>

  <div class="shell" id="shell" hidden>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="content">
      <section id="track"  class="screen"></section>
      <section id="module" class="screen"></section>
      <section id="check"  class="screen"></section>
      <section id="cert"   class="screen"></section>
    </div>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/cultures.js?v=15"></script>
<script src="js/build.js?v=15"></script>
<script src="js/store.js?v=15"></script>
<script src="js/activities.js?v=15"></script>
<script src="js/certificate.js?v=15"></script>
<script src="js/app.js?v=15"></script>
</body>
</html>
